# ---------------------------------------------------------------- models and environment (plan §4.2)

card:cop_model:
  label: Heat-pump COP and thermal demand
  figures: [cop_curves, spf_check, hp_split_monthly]
  classification: derived
  primary: DER-009
  nodes: [M-001, DER-009, TR-008, D-003, D-014, D-014a, D-014b, D-014c, D-014d, D-014e, D-016, A-002, A-003, A-004, A-005,
          QC:qc_thermal_2023]
  qc: [QC:qc_thermal_2023]
  formula: 'COP = η · (T_sup + 273.15) / (T_sup − T_out);  Q_thermal = E_HP · COP'
  summary: >
    Heat delivered is not measured. It is derived from measured heat-pump electricity times a modeled COP whose Carnot
    fraction η is calibrated per building so the annual SPF matches Swiss field data (Arpagaus et al. 2023).
    The non-space-heating baseline of heat-pump electricity (warm-day mean, A-005) becomes the hot-water demand.
  caveats:
    - 'The planned linearity diagnostic (derived heat vs heating degree-days) was found NOT to be a valid test of the COP model; see the addendum in qc_thermal_2023.md.'
    - 'The COP curve is capped at twenty when the outdoor temperature approaches the supply temperature: {fig.cop_curves.buildings[SFH-low].hours_cop_sh_capped_at_20} h (SFH-low), {fig.cop_curves.buildings[SFH-mid].hours_cop_sh_capped_at_20} h (SFH-mid), {fig.cop_curves.buildings[SFH-high].hours_cop_sh_capped_at_20} h (SFH-high) in 2023.'
    - 'Single supply temperature per mode, no defrost and no part-load behaviour (model registry limitations).'
  numbers:
    - {label: 'η space heating, SFH-low', value: '{thermal_params[SFH-low].eta_sh:.4f}', unit: '-'}
    - {label: 'η space heating, SFH-mid', value: '{thermal_params[SFH-mid].eta_sh:.4f}', unit: '-'}
    - {label: 'η space heating, SFH-high', value: '{thermal_params[SFH-high].eta_sh:.4f}', unit: '-'}
    - {label: 'η space heating, MFH-small', value: '{thermal_params[MFH-small].eta_sh:.4f}', unit: '-'}
    - {label: 'η space heating, MFH-medium', value: '{thermal_params[MFH-medium].eta_sh:.4f}', unit: '-'}
    - {label: 'η space heating, MFH-large', value: '{thermal_params[MFH-large].eta_sh:.4f}', unit: '-'}
    - {label: 'SPF target SFH (space heating)', value: '{thermal_params[SFH-low].spf_target}', unit: '-'}
    - {label: 'SPF target MFH (combined)', value: '{thermal_params[MFH-small].spf_target}', unit: '-'}
  code: [swiss/models/heat_pump.py::cop, swiss/models/heat_pump.py::calibrate_eta, swiss/models/heat_pump.py::split_baseline, swiss/pipeline/build_thermal_demand.py]
  docs: [docs/models/heating_dhw_model_design.md, docs/data/data_quality_reports/qc_thermal_2023.md]


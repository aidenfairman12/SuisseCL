  display_name: Outdoor temperature
  figures: [ts_temp, klo_vs_heapo]
  classification: measured
  primary: DER-007
  nodes: [DER-007, TR-005, SRC-004, D-009, D-010, A-001, QC:qc_weather_klo_2023]
  qc: [QC:qc_weather_klo_2023]
  summary: >
    Hourly air temperature measured by MeteoSwiss at Zurich/Kloten, used for all six buildings (D-010).
    Annual mean {qc_weather.annual_mean_temp_c:.1f} °C, range {qc_weather.min.temp_c:.1f} to {qc_weather.max.temp_c:.1f} °C,
    {qc_weather.missing.temp_c} missing hours. MeteoSwiss labels each hour by its END; the series is shifted so that each
    value belongs to the hour that STARTS at the timestamp (D-009).
  numbers:
    - {label: Annual mean, value: '{qc_weather.annual_mean_temp_c:.2f}', unit: °C}
    - {label: Minimum, value: '{qc_weather.min.temp_c:.1f}', unit: °C}
    - {label: Maximum, value: '{qc_weather.max.temp_c:.1f}', unit: °C}

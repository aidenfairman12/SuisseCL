series:carbon_intensity:
  label: Grid carbon intensity (modeled)
  figures: [carbon_cons_vs_dom, carbon_import_stack, epfl_monthly, epfl_diurnal, epfl_table]
  classification: modeled
  primary: DER-011
  nodes: [DER-011, M-002, TR-010, SRC-011, SRC-009, D-013, D-013a, D-013b, A-006, A-007, A-008, A-009, A-010, ISS-033,
          QC:qc_carbon_2023, QC:carbon_epfl_comparison]
  qc: [QC:qc_carbon_2023, QC:carbon_epfl_comparison]
  summary: >
    MODELED, not measured. Hourly lifecycle CO2 intensity of the electricity used in Switzerland, rebuilt from
    Energy-Charts generation and cross-border flow data (M-002). Mean {qc_carbon.mean_consumption_g_kwh:.1f} g/kWh.
    A method check against the EPFL 2016-17 series agrees in shape (hourly r
    {epfl[2016].hourly_consumption_vs_epfl.pearson:.2f}) but not in level (ratio of means
    {epfl[2016].hourly_consumption_vs_epfl.ratio_mean:.2f} in 2016, {epfl[2017].hourly_consumption_vs_epfl.ratio_mean:.2f} in 2017).
    Use it for relative signals only (D-013b).
  numbers:
    - {label: Mean (consumption-based), value: '{qc_carbon.mean_consumption_g_kwh:.1f}', unit: gCO2eq/kWh}
    - {label: Mean (domestic generation only), value: '{qc_carbon.mean_domestic_g_kwh:.1f}', unit: gCO2eq/kWh}
    - {label: 'Proxy factors x0.5 / x1.5', value: '{qc_carbon.proxy_sensitivity_mean_g_kwh[proxies_x0.5]:.1f} / {qc_carbon.proxy_sensitivity_mean_g_kwh[proxies_x1.5]:.1f}', unit: gCO2eq/kWh}
    - {label: Neighbour-fallback hours, value: '{qc_carbon.fallback_flagged_hours}', unit: h}
    - {label: Missing (interpolated) hours, value: '{qc_carbon.missing_consumption_hours}', unit: h}
  caveats:
    - 'Level is about {epfl[2016].hourly_consumption_vs_epfl.ratio_mean:.0%}-{epfl[2017].hourly_consumption_vs_epfl.ratio_mean:.0%} of the EPFL reference: do not quote it as a Swiss grid intensity.'
  flags:

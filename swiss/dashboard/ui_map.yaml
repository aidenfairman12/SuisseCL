  primary: EXP-007
  nodes: [EXP-007, EXP-008, EXP-009, EXP-010, EXP-011, EXP-012, R-001]
  summary: >
    Full-year results of each controller: our own computations (import, peak, cost, ramping, reward) and CityLearn KPIs
    normalised to CityLearn's conventional counterfactual. Every tile opens its card with the formula, the values for

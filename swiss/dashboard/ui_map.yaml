series:carbon_intensity:
  label: Grid carbon intensity (modeled)
  display_name: CO₂ of the grid (estimated)
  figures: [carbon_cons_vs_dom, carbon_import_stack, epfl_monthly, epfl_diurnal, epfl_table]
  classification: modeled
  primary: DER-011
  nodes: [DER-011, M-002, TR-010, SRC-011, SRC-009, D-013, D-013a, D-013b, A-006, A-007, A-008, A-009, A-010, ISS-033,
          QC:qc_carbon_2023, QC:carbon_epfl_comparison]
  qc: [QC:qc_carbon_2023, QC:carbon_epfl_comparison]
  summary: >
    MODELED, not measured. Hourly lifecycle CO2 intensity of the electricity used in Switzerland, rebuilt from
    Energy-Charts generation and cross-border flow data (M-002). The yearly mean is {qc_carbon.mean_consumption_g_kwh:.1f} g/kWh,
    but do not read the level: the proxy emission factors alone move that mean between
    {qc_carbon.proxy_sensitivity_mean_g_kwh[proxies_x0.5]:.0f} and {qc_carbon.proxy_sensitivity_mean_g_kwh[proxies_x1.5]:.0f} g/kWh,
    and the level is only about {epfl[2016].hourly_consumption_vs_epfl.ratio_mean:.0%} to {epfl[2017].hourly_consumption_vs_epfl.ratio_mean:.0%} of the EPFL reference.
    A method check against the EPFL 2016-17 series agrees in shape (hourly r
    {epfl[2016].hourly_consumption_vs_epfl.pearson:.2f}) but not in level (ratio of means
    {epfl[2016].hourly_consumption_vs_epfl.ratio_mean:.2f} in 2016, {epfl[2017].hourly_consumption_vs_epfl.ratio_mean:.2f} in 2017).
    Use it for relative signals only (D-013b).
  numbers:
    - {label: Mean (consumption-based), value: '{qc_carbon.mean_consumption_g_kwh:.1f}', unit: gCO2eq/kWh, note: level not reliable, see the caveats}
    - {label: 'Mean with proxy factors halved / raised by half', value: '{qc_carbon.proxy_sensitivity_mean_g_kwh[proxies_x0.5]:.1f} / {qc_carbon.proxy_sensitivity_mean_g_kwh[proxies_x1.5]:.1f}', unit: gCO2eq/kWh}
    - {label: Mean (domestic generation only), value: '{qc_carbon.mean_domestic_g_kwh:.1f}', unit: gCO2eq/kWh}
    - {label: Neighbour-fallback hours, value: '{qc_carbon.fallback_flagged_hours}', unit: h}
    - {label: Missing (interpolated) hours, value: '{qc_carbon.missing_consumption_hours}', unit: h}
  caveats:
    - 'Level is about {epfl[2016].hourly_consumption_vs_epfl.ratio_mean:.0%}-{epfl[2017].hourly_consumption_vs_epfl.ratio_mean:.0%} of the EPFL reference: do not quote it as a Swiss grid intensity.'
    - 'The yearly mean swings between {qc_carbon.proxy_sensitivity_mean_g_kwh[proxies_x0.5]:.0f} and {qc_carbon.proxy_sensitivity_mean_g_kwh[proxies_x1.5]:.0f} g/kWh depending on the proxy emission factors (halved or raised by half). The shape is reliable, the level is not.'
  flags:
    - {column: neighbour_intensity_fallback_flag, label: neighbour fallback}
    - {column: gap_interpolated_flag, label: interpolated}
  code: [swiss/pipeline/build_carbon.py::intensity, swiss/pipeline/build_carbon.py, swiss/validation/compare_epfl_carbon.py::stats]
  docs: [docs/data/data_quality_reports/carbon_epfl_comparison.md]


# ui_map.yaml - the ONLY hand-written mapping of the audit dashboard (plan §3).
#
# Each top-level key is one clickable UI element. Keys are "<kind>:<name>" with kind in
#   series | card | kpi | map | panel | figure
# Fields:
#   label      short title shown on the card
#   nodes      registry IDs (and other node IDs such as QC:..., PAR:...) the element is built from
#   primary    the main node (its classification badge is shown)
#   classification  measured | derived | modeled | synthetic | assumption | mixed  (for series/cards)
#   summary    plain-language text. Numbers ONLY via placeholders {namespace.path:format}; lint.py rejects digits
#              in prose that are not inside a placeholder, a registry ID or _settings.prose_allowed_tokens.
#   numbers    key numbers: [{label, value: "{placeholder}", unit}]
#   caveats    warnings shown prominently (same placeholder rules)
#   code       ["path.py::function"] - cut out with ast at build time and embedded with the commit SHA
#   qc         QC node IDs, e.g. QC:qc_carbon_2023
#   docs       repo files to link
#   flags      [{column, label}] hour flags drawn by the trust overlay
#   lineage_end  for synthetic items whose lineage ends in a decision/assumption instead of a source
#   nodes_open_issues  true = link every currently open ISS-* (computed at build time, not hand-listed)
# Placeholder namespaces (filled by build_bundle.load_data): qc_carbon, qc_weather, qc_tariff, qc_thermal,
#   qc_buildings, backtest, epfl, validation, thermal_params, build_manifest, reward_scales, baselines_meta,
#   columns, results[<controller>], sensitivity[<variant>|<controller>].
# Load with yaml.safe_load only.

_settings:
  # tokens with digits that may appear in prose without a placeholder (years, version strings, unit names)
  prose_allowed_tokens: ['2023', '2016', '2017', '2016-17', '3.3.0', 'CO2', 'CO2eq', 'kWh_th', 'kW²', 'ALG-001..004',
                         '24-hour', 'CH2025', 'AR5', 'A.III.2', 'Building_1', 'Building_6', 'SPF_SH', 'S0', 'S1', 'S2', 'S3']
  classification_colours:
    measured: '#2b6cb0'
    derived: '#2f855a'
    modeled: '#b7791f'
    synthetic: '#c53030'
    assumption: '#6b46c1'
    mixed: '#4a5568'

# ---------------------------------------------------------------- plain-language layer (story page, names, glossary)
# All prose of the story page lives here. Numbers only through {placeholders} (namespaces as above plus `derived`, `names`,
# `tariff`); [[words|term_id]] marks a glossary term. lint.py enforces: no digits outside placeholders, no registry IDs,
# every term id exists, every controller/building has a display name. The verdict and the "what's next" wording are
# interpretation and are reviewed by the project owner.

_controllers:     # key = controller as named in baselines_2023.csv
  ALG-001_zero_action: {key: none, display_name: No control, short_name: No control, node: ALG-001}
  ALG-002_business_as_usual: {key: bau, display_name: Business as usual, short_name: Business as usual, note: identical to no control in this district, node: ALG-002}
  ALG-003_basic_rbc: {key: night, display_name: Night-charging rule, short_name: Night rule, node: ALG-003}
  ALG-004_hour_rbc_tariff_r0.05: {key: tariff_gentle, display_name: Tariff-timed rule (gentle), short_name: Tariff, node: ALG-004}
  ALG-004_hour_rbc_tariff_r0.10: {key: tariff_medium, display_name: Tariff-timed rule (medium), short_name: Tariff, node: ALG-004}
  ALG-004_hour_rbc_tariff_r0.20: {key: tariff_strong, display_name: Tariff-timed rule (strong), short_name: Tariff, node: ALG-004}

_buildings:       # key = role as named in the bundle
  SFH-low: Single-family house (low use)
  SFH-mid: Single-family house (medium use)
  SFH-high: Single-family house (high use)
  MFH-small: Apartment building (small)
  MFH-medium: Apartment building (medium)
  MFH-large: Apartment building (large)

_building_groups: # plain names for the two kinds of building (chart axes and legends)
  SFH: Single-family houses
  MFH: Apartment buildings

_carbon_relative: # how the modeled CO2 of the grid is shown outside its audit card: as a rank within the year, never in g/kWh
  # {pct} and {year} are filled by the UI from series_inputs.carbon_rank (percent of hours below this hour, and the year).
  # `line` is shown in the district feed card with `sub` under it; the Inputs hour panel shows both on one line.
  cleaner: "Cleaner than {pct} % of hours"
  dirtier: "Dirtier than {pct} % of hours"
  typical: "A typical hour for CO₂"
  missing: "No CO₂ estimate for this hour"
  sub: "in {year}, modeled"
  typical_band_pct: [40, 60]   # ranks inside this band count as typical

_pages:           # the question each Explore page answers
  inputs: What data drives the simulation, and how far can each series be trusted?
  model: How do the measured inputs become heat demand, storage and electricity use?
  results: What does each control rule do to the bill, the highest grid draw and the electricity bought, and when in the year?
  audit: Where does every number come from, and what is still open?
  scenarios: Which solar, battery, building and price assumptions does Phase B add, and how much of the bill could an ideal controller save at each step?
  controllers: How much of that ideal saving do real controllers reach, and what do forecasts, peaks and model errors change?
  climate: What weather does Phase C use for a warmer climate, how was it built from the Swiss climate scenarios, and how far can it be trusted?
  cooling: What do warming and cooling adoption change in the district's electricity use, in what solar covers, in the grid draw and in what controllers can save?
  explorer: What does one climate, one cooling level and one controller do to the district's energy over the year and hour by hour in a July week?
  houses: What does cooling add to each kind of house, how much of it does solar cover, and what reaches the grid?
  glossary: What do the technical terms on this site mean?

# ---------------------------------------------------------------- Phase B pages (Scenarios, Controllers), WP5a. Agent's draft wording: the interpretation
# sentences are for the owner's review. Numbers only through {pb.*} placeholders (namespace filled by swiss/dashboard/phase_b.py); no registry IDs in prose.
_phase_b:
  scenarios:
    intro: >
      Phase A simulated heating and hot water only. Phase B adds solar panels, a battery, a building thermal model and richer
      prices, one rung at a time, and asks the same question at each rung: how much of the electricity bill could an ideal
      controller with perfect foresight save? Every solar size, battery size, export price and building parameter on this page
      is an assumption, not a measurement of these buildings.
    gate: >
      The project rule is to add learning only where the exact optimum saves at least {pb.gate_pct:.0f} % of the bill. The
      bare Phase A district ({pb.ceil.s0.year:.1f} %) does not pass; S1, S2 and S3 do.
    ceilings: >
      The saving is measured on the eight test weeks used for every controller and on the full year. The two differ a little because
      the test weeks are not a typical sample of the year.
    mass: >
      Letting the building store heat in its own walls adds {pb.mass_points:.1f} percentage points on top of the tanks and the
      battery (S3 with a comfort band against S3 with the building held at the thermostat path). Under a wider comfort band the
      ceiling is {pb.bands.s3_band_20_24:.1f} %.
    export: >
      The export price matters most: the S2 ceiling is {pb.sweep.0.S2:.1f} % when exports earn nothing and {pb.sweep.12.S2:.1f} % at the
      highest price tested.
    tariffs: >
      Richer price structures raise the ceilings: across all tariff variants, including the stylised ones, the S2 ceiling
      ranges from {pb.tariff_s2_min:.1f} % to {pb.tariff_s2_max:.1f} %. Pilot and day-ahead structures were applied outside the period they
      come from, and the stylised spreads are what-ifs, not tariffs that exist.
    resolution: >
      Simulating in quarter-hours instead of hours changes the S2 ceiling by {pb.q15_gain_s2:+.1f} percentage points; the weather stays hourly information.
    peaks: >
      The bill-optimal schedule is not a grid-friendly schedule. On S2 the highest hour of the district rises from
      {pb.peak.s2_zero_kw:.0f} kW to {pb.peak.s2_opt_kw:.0f} kW ({pb.peak.s2_rise_pct:+.0f} %), on S3 by {pb.peak.s3_rise_pct:+.0f} %, because
      the battery and tanks all charge in the cheapest hours.
    evleg: >
      Electric-vehicle charging and a local electricity community are labelled what-ifs on S2. Making the vehicles' charging
      flexible is worth {pb.ev_value_chf:.0f} CHF a year ({pb.ev_value_pct:.2f} % of the bill); the community gain depends on the grid-fee discount assumed.
    ladder:
      - id: S0
        name: Heating and hot water only
        adds: >
          The Phase A district on the standard two-tier tariff. The heat-pump tanks are the only flexible devices. An ideal
          controller saves {pb.ceil.s0.year:.1f} % of the yearly bill.
        classes: [measured, derived, synthetic]
        nodes: [D-036]
      - id: S1
        name: Assumed solar panels
        adds: >
          Rooftop solar on every building, sized from the building's own yearly use (south facing, tilted, pvlib model), and an
          assumed export price. Surplus sun can be stored in the tanks. An ideal controller saves {pb.ceil.s1.year:.1f} % of the year
          and {pb.ceil.s1.week:.1f} % of the eight test weeks.
        classes: [assumption, modeled]
        nodes: [M-003, A-013, A-015, D-033]
      - id: S2
        name: Assumed solar panels and battery
        adds: >
          S1 plus a battery per building, one kilowatt-hour per kilowatt of solar, with assumed efficiency and power. An ideal
          controller saves {pb.ceil.s2.year:.1f} % of the year and {pb.ceil.s2.week:.1f} % of the eight test weeks.
        classes: [assumption, modeled]
        nodes: [M-004, A-016, A-017, D-035]
      - id: S3
        name: Assumed solar, battery and building thermal model
        adds: >
          S2 plus a single-node model of each building's heat balance with a comfort band around the thermostat setpoint, so the
          walls can store heat; the thermostat is the reference. An ideal controller saves {pb.ceil.s3.year:.1f} % of the year and
          {pb.ceil.s3.week:.1f} % of the eight test weeks.
        classes: [assumption, modeled, synthetic]
        nodes: [M-005, A-018, A-019, A-020, D-038, D-039]
  controllers:
    intro: >
      Every controller on this page is judged on the same eight held-out weeks, against the same reference (doing nothing, or the
      thermostat on S3), and next to the exact optimum with perfect foresight, which no real controller can reach.
    findings:
      - >
        Reinforcement learning did not beat the reference on any rung. The central learner saves
        {pb.rl.s1.sac_central:+.1f} % (S1), {pb.rl.s2.sac_central:+.1f} % (S2) and {pb.rl.s3.sac_central:+.1f} % (S3) of the bill, where a negative
        number is a loss; on S3 it also lets the buildings get cold.
      - >
        A planner that re-solves the optimisation every hour with the true future reaches the ideal saving: {pb.mpc.s2.perfect:.1f} % on S2
        against a ceiling of {pb.ceil.s2.week:.1f} %. The gap to the ceiling is therefore the cost of not knowing the future, not of the method.
      - >
        With forecasts that use the weather the same planner reaches {pb.mpc.s1.weather:.1f} % (S1), {pb.mpc.s2.weather:.1f} % (S2) and
        {pb.mpc.s3.weather:.1f} % (S3), against {pb.mpc.s1.rule:.1f} %, {pb.mpc.s2.rule:.1f} % and {pb.mpc.s3.rule:.1f} % for the hand-set solar rule.
        That is {pb.share_of_ceiling_s2:.0f} % and {pb.share_of_ceiling_s3:.0f} % of the ceiling on S2 and S3. The weather is taken as known in these runs.
      - >
        Forecasts that only look at the past are not enough: copying the same hour of last week gives {pb.mpc.s2.naive:.1f} % on S2,
        less than the solar rule.
      - >
        The household load is the forecast that limits everything. With the true load instead of a forecast the S2 saving rises
        from {pb.mpc.s2.weather:.1f} % to {pb.mpc.s2.true_load:.1f} %. The load of these buildings is a constructed composite, so this
        limit may differ for real houses.
      - >
        The planner that only minimises the bill raises the highest hour of the district from {pb.mpc.s2.zero_kw:.0f} kW to {pb.mpc.s2.weather_kw:.0f} kW. A small
        peak weight keeps the saving ({pb.mpc.s2.weather_peak01:.1f} %) and brings the highest hour to {pb.mpc.s2.weather_peak01_kw:.0f} kW.
      - >
        On S3, if the planner's room model is wrong by a fifth, comfort is violated for {pb.mpc.s3.x08_cold:.0f} K·h over the eight weeks.
        Online correction of the model plus a small comfort margin brings that to {pb.mpc.s3.x08_corr_m02_cold:.0f} K·h at a saving of
        {pb.mpc.s3.x08_corr_m02:.1f} %.
      - >
        Planning against error scenarios of the measured size did worse than planning against one forecast ({pb.stoch.min:.1f} % to
        {pb.stoch.max:.1f} % against {pb.stoch.det:.1f} %). The cause is not identified.
    rl_note: >
      The learners were trained for a short budget with a reward whose weights were set by hand and not tuned. This is a negative
      result for these settings, not a proof that learning cannot work here.
    forecast_note: >
      Error is expressed as a multiple of the standard deviation of each series. The synthetic points add that much random error to
      the true future. The two real forecasters are placed by their measured error on the eight test weeks: the household load,
      the forecast that limits everything, is off by {pb.forecast.history_load:.2f} for the history-only forecaster and
      {pb.forecast.weather_load:.2f} for the weather-conditioned one; the solar forecast is off by {pb.forecast.history_pv:.2f}
      and {pb.forecast.weather_pv:.2f}. The weather is taken as known in the weather-conditioned case, so its solar error is a
      lower bound.
    tradeoff_note: >
      Each point is one peak weight in the planner. The weight is a tuning knob in the optimisation, not a tariff. The highest hour
      is the largest district grid draw in the eight test weeks.
    model_error_note: >
      The planner believes the building has a different heat loss and heat capacity than the simulated one. Comfort is the sum of
      temperature shortfalls below the setpoint over all buildings and hours, in kelvin-hours.
    curves_note: >
      Bill change against the reference during training, evaluated on the test weeks; a positive number is a loss. Each line is one
      training run.
    stochastic_note: >
      Several error scenarios per decision, with the first steps shared by all scenarios. At the measured error size every variant is
      worse than the single forecast; with the sampled errors scaled down to a fraction the result returns to the single-forecast level.
    limitations_title: What limits how far these results can be read
    limitations_intro: >
      These open issues and assumptions come from the project registers and affect how the numbers above should be read.
  limitations:
    - ISS-032
    - ISS-034
    - ISS-040
    - ISS-041
    - ISS-042
    - A-028
    - A-029
    - A-030
    - A-031

# ---------------------------------------------------------------- Phase C pages (Climate, Cooling, Explorer, Houses), WP5b. Agent's draft wording: the
# interpretation sentences are for the owner's review. Numbers only through {pc.*} placeholders (namespace filled by swiss/dashboard/phase_c.py); no registry IDs in prose.
_phase_c:
  climate:
    intro: >
      Phase C asks what a warmer climate and cooling do to the district. The weather is the observed 2023 year at Kloten with the
      change of the Swiss CH2025 climate scenarios added for two global warming levels. A heat-wave week taken from the same scenarios
      can be inserted into the July test week. Everything on this page is constructed weather, not a forecast of a particular year.
    construction:
      - >
        The scenario data are daily values per climate-model chain: mean, lowest and highest temperature, solar radiation and humidity, for a reference period and for
        each warming level. For every month the middle value over all chains is compared with the reference, and that change is added to the observed 2023
        hours: temperature by an amount that moves from the change of the daily low to the change of the daily high through the day, radiation and humidity by a ratio.
      - >
        The 2023 sequence of days, and the shape of a typical day, are kept. So these are typical warmer years with the weather of 2023, not new weather sequences.
      - >
        A heat wave is one seven-day spell chosen from the scenario chains at a stated rank among all seven-day spells of a level (the hottest one percent for the heat-wave
        variants). Its daily values are turned into hours with the observed shape of a hot 2023 day, and it replaces the July test week.
    stats: >
      The annual mean temperature rises from {pc.climate.hist_mean:.1f} degrees in 2023 to {pc.climate.g2_mean:.1f} and {pc.climate.g3_mean:.1f} degrees at the two warming
      levels. Days whose hottest hour reaches thirty degrees go from {pc.climate.hist_d30:.0f} to {pc.climate.g3_d30:.0f}, and days reaching thirty-five degrees from
      {pc.climate.hist_d35:.0f} to {pc.climate.g3_d35:.0f}.
    heatwave: >
      In the inserted week the mean temperature is {pc.climate.hw_hist:.1f} degrees with today's climate and {pc.climate.hw_g3:.1f} degrees at the high warming level, with a
      highest hour of {pc.climate.hw_g3_max:.1f} degrees; the observed 2023 week had a mean of {pc.climate.obs_w29:.1f} degrees.
    validation: >
      To test the step from daily values to hours, every observed 2023 day was rebuilt from only its own lowest, highest and mean temperature with a typical-day shape that does
      not contain that day. The error is {pc.climate.rmse_all:.1f} K over all days and {pc.climate.rmse_hot:.1f} K on hot days.
    limits:
      - >
        One station (Kloten) and one weather year as the base: there is no year-to-year variability and no change in how often weather types occur, except in the inserted spell.
      - >
        The climate-model data are bias-adjusted model output. Their highest daily temperatures at Kloten are not credible in the far tail, so spells are chosen at a stated rank, never by the single highest value.
      - >
        Heat waves are sequences from single model chains made hourly by a documented method; their radiation and humidity are only consistent in the daily mean.
      - >
        The scenario radiation is global only; the split into direct and diffuse follows the 2023 relation and a clear-sky shape, not a measurement.
      - >
        The milder spell variants are less hot than the hottest observed 2023 week, so they are shown only as a sensitivity.
    citation_note: >
      The CH2025 data are open data of MeteoSwiss and ETH Zurich and are cited as required by their terms of use.
  cooling:
    intro: >
      Every cell below is the same district with solar panels, a battery and a building thermal model, in one weather scenario and one cooling level. The reference
      is a thermostat that heats to the setpoint and cools to the cooling setpoint where a cooling device exists. Cooling is modelled, not measured: no cooling data exist
      for these buildings.
    archetype_note: >
      The cooling system archetype selects how cooling is provided. In the central archetype one reversible heat pump cools the whole building. In the room-unit archetype units
      cool only a share ({pc.arch.f_default_pct:.0f} % of the floor area, an assumption without a source) of a cooled building and the rest floats. Buildings without cooling are the same in both
      archetypes. The findings below are for the central archetype; the comparison section shows what changes with room units.
    model_note: >
      The cooling device is the heating heat pump run in reverse with the same electric rating. Its coefficient of performance follows the Carnot form at a supply
      temperature of {pc.rc.cool_supply:.0f} degrees, cooling is switched off when it is colder than {pc.rc.cool_min_outdoor:.0f} degrees outside, and the cooled building is held below
      {pc.rc.cool_setpoint:.0f} degrees in the cooling season. Buildings without cooling float. The cooling levels are by whole building: low cools the small apartment building,
      medium the medium one, high the large one; the other high assignment cools the medium and small apartment buildings and the three houses.
    findings:
      - >
        Warming lowers heating by more than cooling adds. Heating electricity of the heating-only district falls from {pc.heat.hist_mwh:.1f} MWh in 2023 weather to {pc.heat.g3_mwh:.1f} MWh
        at the high warming level ({pc.heat.g3_drop_pct:.0f} %), about {pc.cool.g3_drop_mwh:.1f} MWh less, while cooling adds {pc.cool.min_mwh:.1f} to {pc.cool.max_mwh:.1f} MWh a year
        across the whole range of the central cells.
      - >
        Building thermal mass is worth only a little more with cooling. The extra saving from using the building as storage is {pc.mass.none_min:.1f} to {pc.mass.none_max:.1f} percentage
        points without cooling and {pc.mass.cool_min:.1f} to {pc.mass.cool_max:.1f} with it; only the other high assignment, which cools the houses, reaches {pc.mass.alt_max:.1f}.
      - >
        Solar covers most of the cooling electricity in the same hour. With the thermostat, solar directly supplies {pc.pvshare.thermo_min:.0f} to {pc.pvshare.thermo_max:.0f} % of it in
        the central cells; under the exact optimum solar and the battery together supply {pc.pvshare.opt_min:.0f} to {pc.pvshare.opt_max:.0f} %. This is a bookkeeping rule, not a physical split.
      - >
        Cooling barely raises the summer peak. Against the heating-only district of the same weather, the largest rise of the summer peak is {pc.summerpeak.thermo_max:.1f} kW with the
        thermostat and {pc.summerpeak.opt_max:.1f} kW under the exact optimum. The exact optimum itself raises the summer peak from {pc.summer_peak.thermo_kw:.0f} kW to
        {pc.summer_peak.opt_kw:.0f} kW in 2023 weather, with or without cooling, because the battery and tanks charge together.
      - >
        What reaches the grid is small. In the high-warming heat-wave cell the cooling adds {pc.spill.import_kwh:.0f} kWh of grid import over the year with the thermostat and lowers
        export by {pc.spill.export_kwh:.0f} kWh: most of the cooling energy comes out of solar power that would otherwise be exported.
      - >
        The planner reaches {pc.mpc.share_min:.0f} to {pc.mpc.share_max:.0f} % of the exact optimum on the eight test weeks in every central cell, the hand-set rule {pc.mpc.rule_min:.0f} to
        {pc.mpc.rule_max:.0f} %. Without a peak weight the planner's highest hour is {pc.mpc.peak_mpc_min:.0f} to {pc.mpc.peak_mpc_max:.0f} kW, against {pc.mpc.thermo_peak_min:.0f} to
        {pc.mpc.thermo_peak_max:.0f} kW for the thermostat; with a small peak weight it stays below {pc.mpc.peak01_max:.0f} kW, and its saving is at worst {pc.mpc.peak01_delta_min:+.2f} percentage points from the planner without it.
      - >
        Overheating of buildings without cooling is large and identical in every such building ({pc.dh26.per_uncooled_building_hist:,.0f} degree-hours above the cooling setpoint in
        2023 weather). That is a limit of the thermal model, which has no shading, ventilation or behaviour and uses the same per-area priors for every building. Read the
        degree-hours as an indicator, not a prediction.
    ru_model_note: >
      In the room-unit archetype a cooled building is split into two independent thermal models with the same properties per square metre: a cooled part with {pc.arch.f_default_pct:.0f} % of the floor
      area and an uncooled part with the rest. They do not exchange heat. Heating is one action shared in proportion to area. Cooling acts on the cooled part only, with a unit capacity in
      proportion to its share, no operating schedule, and the same efficiency, supply temperature and outdoor switch-off as the central archetype.
    archetype_compare_intro: >
      The same cooling levels and weather scenarios with the two archetypes. Cooling electricity per cooled building differs by construction, because room units cool only part of the
      building. The comparison shows how much the conclusions depend on how cooling is provided, not which archetype is right: neither is checked against Swiss field data.
    archetype_compare_note: >
      With the thermostat, room units use {pc.arch.cool_ratio_min:.1f} to {pc.arch.cool_ratio_max:.1f} % of the cooling electricity of the central archetype ({pc.arch.cool_ratio_opt_min:.1f} to
      {pc.arch.cool_ratio_opt_max:.1f} % under the exact optimum), as the cooled share implies. The exact optimum saving differs by at most {pc.arch.ceiling_diff_max:.1f} percentage points and the summer
      peak by at most {pc.arch.peak_diff_max:.1f} kW with the thermostat ({pc.arch.peak_opt_diff_max:.1f} kW under the exact optimum). The value of thermal mass is {pc.arch.mass_diff_min:+.1f} to
      {pc.arch.mass_diff_max:+.1f} percentage points different, because less floor area is cooled. Solar covers {pc.arch.pv_b_min:.0f} to {pc.arch.pv_b_max:.0f} % of the cooling electricity with room units against
      {pc.arch.pv_a_min:.0f} to {pc.arch.pv_a_max:.0f} % with central cooling (thermostat, default allocation rule). The planner reaches {pc.arch.mpc_b_min:.0f} to {pc.arch.mpc_b_max:.0f} % of the exact optimum and
      the hand-set rule {pc.arch.rule_b_min:.0f} to {pc.arch.rule_b_max:.0f} % in the room-unit cells.
    fraction_note: >
      The cooled share is varied in the cell with the high warming level, a heat wave and high cooling: {pc.arch.f_lo:.1f}, the default {pc.arch.f_default:.1f}, {pc.arch.f_hi:.1f} and the whole building.
      Cooling electricity with the thermostat rises from {pc.arch.sens_cool_lo:,.0f} kWh through {pc.arch.sens_cool_def:,.0f} kWh to {pc.arch.sens_cool_full:,.0f} kWh for the whole building, the value of
      thermal mass from {pc.arch.sens_mass_lo:.1f} to {pc.arch.sens_mass_full:.1f} percentage points, and the planner stays between {pc.arch.sens_mpc_min:.1f} and {pc.arch.sens_mpc_max:.1f} % of the optimum.
    ru_overheat_note: >
      The uncooled part of a cooled building overheats like an uncooled building, because the thermal model has no shading, ventilation or behaviour: in 2023 weather the uncooled parts of the
      cooled buildings add {pc.arch.dh_zone_uncooled_k:,.1f} thousand degree-hours above the cooling setpoint and the cooled parts {pc.arch.dh_zone_cooled_k:,.1f} thousand. Read degree-hours as an indicator only.
    heatmap_note: >
      Rows are weather scenarios, columns are cooling levels. The exact optimum is the best possible bill with perfect foresight over the year; the planner and the rule are scored on
      the eight test weeks, one of which holds the inserted heat wave in the heat-wave scenarios.
    controllers_note: >
      Saving is against the thermostat on the same weeks. The share of the optimum divides the saving by what the exact optimum saves on those weeks.
    robustness_note: >
      Robustness of the planner on the heat-wave cells with high adoption. Errors in the forecast weather (temperature bias, noise, irradiance noise) are synthetic: they were
      added by hand and are not archived forecast errors. The planner trained on 2023 weather only is as good as the planner trained on the scenario year
      ({pc.robust.hist_trained_share:.0f} % against {pc.robust.scen_share:.0f} % of the optimum at the high warming level), because heating and cooling come from the physical room model
      and not from a learned forecast. A forecast that is two degrees too warm leaves {pc.robust.tp2_cold:.0f} K·h of cold; online correction with a small comfort margin brings that to
      {pc.robust.tp2corr_cold:.0f} K·h.
    limitations_title: What limits how far these results can be read
    limitations_intro: >
      These open issues and assumptions come from the project registers.
    pending_title: Phase C assumptions not yet in the registers
  explorer:
    intro: >
      Choose a cooling system, a weather scenario, a cooling level and a controller. Every controller has an hour-by-hour July week and the numbers of the eight test weeks.
      The yearly chart exists only for the thermostat and the exact optimum, which were simulated for the whole year; the rule and the planners were simulated week by week.
    week_note: >
      The week shown is the July test week, which holds the inserted heat wave in the heat-wave scenarios. The thermostat and optimum curves continue a year-long simulation; the rule and the planner start the week from empty tanks after a
      warm-up, so the first hours can differ a little between the two groups. Values are district sums of the six buildings.
    missing_note: >
      This controller was not simulated hour by hour for this case.
  houses:
    intro: >
      Per building: what cooling adds, what warming saves in heating, how much of the cooling electricity solar covers, and what reaches the grid. All differences compare a cell
      with the heating-only cell of the same weather (the difference method), and heating saved by warming compares the heating-only cell in the scenario weather with the one in 2023 weather.
    zone_note: >
      For the cooled building of a room-unit cell the degree-hours above the cooling setpoint are given for the cooled and for the uncooled part of the building, each from that part's own
      temperature; the figure for the whole building is the mean of the two weighted by floor area. The other buildings are not split.
    rule_note: >
      The solar coverage uses an allocation rule: in every hour solar power serves base load and hot water first, then the heat pump, then the battery. Allocating solar to the heat
      pump first is shown as a sensitivity. The rule is a bookkeeping choice, because the same kilowatt-hour of solar cannot be attributed to one load uniquely.
  limitations:
    - ISS-032
    - ISS-034
    - ISS-040
    - ISS-046
    - ISS-047
    - ISS-048
    - A-028
    - A-029
    - A-030
    - A-031
  limitations_if_registered:
    - ISS-049
    - ISS-050
    - ISS-051
    - A-058
    - A-059
    - A-060
    - A-061
  pending_register:
    - title: Cooling device and efficiency
      register_id: A-040
      text: >
        Cooled buildings have a reversible heat pump with the same electric rating, efficiency and supply temperature as the heating device. The cooling efficiency follows
        the Carnot form, and cooling is switched off below {pc.rc.cool_min_outdoor:.0f} degrees outside because the formula returns an unrealistic value there.
    - title: Comfort bands
      register_id: A-042
      text: >
        Cooled buildings keep the room between the heating setpoint and an upper limit that is lower in the heating season and equals the cooling setpoint of {pc.rc.cool_setpoint:.0f} degrees
        from June to September. Buildings without cooling float and are judged by degree-hours above the cooling setpoint.
    - title: Cooling levels
      register_id: A-044
      text: >
        Cooling levels are by whole building, set by the share of dwelling units. They were proposed by the agent from thin and partly commercial evidence and are not confirmed by the owner. A level
        mixes the adoption share with the identity of the building that is cooled.
    - title: Buildings and loads do not change with the climate
      register_id: A-045
      text: >
        The thermal parameters and areas, the household load, hot-water use, solar panel size and battery size are the Phase B values in every weather scenario. Only the weather,
        the solar production and the heat-pump efficiency respond to the climate.
    - title: Solar allocation rule
      register_id: A-056
      text: >
        The shares of cooling electricity covered by solar, battery or grid use a stated priority order. It is a bookkeeping rule, not a physical attribution.
    - title: Synthetic forecast-weather errors
      register_id: A-055
      text: >
        The robustness cases add temperature bias and noise and irradiance noise with a fixed seed. They are synthetic and not archived forecast errors. The planner uses
        weather as known in all other cells.
    - title: What the replay checks
      register_id: ISS-051
      text: >
        The exact optimum is replayed in the simulator and agrees to the cent, but the program and the simulator share one room-model step, so the replay checks the action mapping and not the physics.
    - title: Overheating without cooling
      register_id: ISS-046
      text: >
        The thermal model has no shading, ventilation or behaviour and the same per-area parameters for every building, so degree-hours above the cooling setpoint in buildings
        without cooling are identical and large. They are an indicator of discomfort, not a prediction.

_glossary:
  - {id: heat_pump, term: Heat pump, definition: "An electric machine that moves heat from outdoor air into a building. It delivers several units of heat for each unit of electricity it uses."}
  - {id: cop, term: COP (coefficient of performance), definition: "Heat delivered divided by electricity used at one moment. It is higher on mild days and lower on cold days.", node: card:cop_model}
  - {id: spf, term: SPF (seasonal performance factor), definition: "The COP averaged over a whole year. The model is tuned so each building's yearly SPF matches published Swiss field data.", node: card:cop_model}
  - {id: dhw, term: Hot water (DHW), definition: "Domestic hot water for showers and taps, as opposed to space heating. Heat pumps usually serve both."}
  - {id: storage_tank, term: Storage tank, definition: "A water tank that stores heat. Charging it early lets a home use the heat later, so the heat pump can run when electricity is cheap or the grid is quiet.", node: card:tanks}
  - {id: tou_tariff, term: Time-of-use tariff, definition: "A price that depends on the hour: lower at night and on weekends, higher during the working day.", node: series:price}
  - {id: kw_kwh, term: kW and kWh, definition: "Power (kW) is how fast energy flows at one moment, like speed. Energy (kWh) is the total that has flowed, like distance. A bill is charged for energy; a grid is sized for power."}
  - {id: peak, term: Highest grid draw (peak), definition: "The largest power the district takes from the grid in any hour of the year. Grids and fuses are sized for it.", node: kpi:district_peak_kw}
  - {id: rule_based_control, term: Rule-based control, definition: "A controller that follows fixed rules, such as charging the tanks at night. The rules are written by hand and do not learn.", node: card:controllers}
  - {id: rl, term: Reinforcement learning, definition: "A way of letting software learn good control by trial and error against a score. It is planned for later phases and is not used yet."}
  - {id: carbon_intensity, term: Carbon intensity, definition: "How much CO2 is emitted per unit of electricity at a given hour. It is lower when hydro and nuclear dominate and higher when imports from fossil-heavy neighbours are needed.", node: series:carbon_intensity}
  - {id: measured, term: Measured, definition: "Recorded by a real sensor or meter, such as a smart meter or a weather station."}
  - {id: derived, term: Calculated (derived), definition: "Worked out from measured data with a stated formula, such as heat demand from heat-pump electricity."}
  - {id: modeled, term: Modeled, definition: "Produced by a model rather than observed. The carbon curve is an example, so its level is an estimate."}
  - {id: synthetic, term: Constructed (synthetic), definition: "Built for this study because no real data exists, such as the tank sizes and the apartment loads. Always shown hatched or labelled as assumed."}
  - {id: counterfactual, term: Conventional counterfactual, definition: "The reference CityLearn compares against: the same buildings without storage control. A value of one means no change from it; lower is better."}
  - {id: exact_optimum, term: Exact optimum (ceiling), definition: "The best possible bill if the whole future were known, found with a linear program and replayed in the simulator to confirm it. It is an upper reference that no real controller can reach.", node: D-036}
  - {id: mpc, term: Receding-horizon planner (MPC), definition: "A controller that plans the next day or two with forecasts every hour, applies only the first step, and plans again with the newest information.", node: ALG-011}
  - {id: held_out_weeks, term: Held-out weeks, definition: "Eight weeks of the year kept aside for testing. Learners never train on them, and every controller is scored on them.", node: EXP-017}
  - {id: warming_level, term: Global warming level, definition: "A scenario labelled by how much the global average temperature has risen above the pre-industrial level. The Swiss scenarios give the regional change for each level, which is larger than the global one."}
  - {id: delta_change, term: Delta change, definition: "A way to build future weather by adding the scenario's change (the delta) to an observed year. It keeps the real sequence of days and a typical day shape, and it cannot create new kinds of weather."}
  - {id: heat_wave, term: Heat wave (inserted spell), definition: "A seven-day spell of very hot weather taken from the climate-scenario chains at a stated rank among all spells and inserted into the July test week. It is constructed, not observed."}
  - {id: degree_hours, term: Degree-hours, definition: "The sum over hours of how far the indoor temperature is above (or below) a limit. One degree for one hour is one degree-hour."}
  - {id: adoption_level, term: Cooling level (adoption), definition: "How much of the district has cooling: none, low, medium or high, set here by which whole buildings are cooled and the share of dwelling units they hold."}
  - {id: thermal_mass, term: Thermal mass, definition: "The heat a building's walls and floors can store. Heating or cooling a little early lets the building act as a battery, within the comfort band."}
  - {id: pv_allocation, term: Solar allocation rule, definition: "A bookkeeping rule that assigns each hour's solar power to loads in a fixed order, to say how much of a load solar covers. It is a convention, not a physical attribution."}
  - {id: difference_method, term: Difference method, definition: "Comparing a cell with cooling against the same cell without cooling, with the same weather and the same controller, to find what cooling adds."}
  - {id: peak_weight, term: Peak weight, definition: "A penalty on the district's highest grid draw added to the planner's bill objective. A larger weight gives up some saving for a lower peak.", node: EXP-019}

_story:
  hero:
    question: Can smarter timing of heat pumps and hot-water tanks cut electricity cost and grid peaks in Swiss homes?
    context: >
      Swiss homes are switching to [[heat pumps|heat_pump]], and heat pumps draw the most on cold winter evenings, exactly when
      the whole grid is busy. Electricity is cheaper at night under a [[time-of-use tariff|tou_tariff]], and a
      [[storage tank|storage_tank]] lets a home heat early and use the heat later. This project builds a realistic
      test bed to find out how much that timing can help.
    status: "Phase {derived.phases.a.letter} of {derived.phases.count} · the test bed is built and the first simple control rules are tested"
    tiles:
      - {value: "{derived.n_buildings}", label: "real Zurich-area buildings: {derived.n_houses} houses and {derived.n_apartments} apartment buildings"}
      - {value: "{derived.hours:,}", label: "hours of 2023 simulated, one hour at a time"}
      - {value: Every, label: number can be traced back to its source}
  district:
    title: The test bed
    caption: >
      Drag the slider to see one hour of the year: heat pumps run, tanks fill and empty, and electricity flows in from the
      grid. Switch the control rule to compare. Hatched parts are assumed, not measured: in the apartment buildings the heat
      pump and the shared areas are measured, but the apartments' own electricity is taken from other homes.
  how:
    title: How the simulation works
    steps:
      - {title: Real meter data, text: "Hourly electricity of the heat pumps and households, recorded in homes around Zurich.", node: "series:building_electricity"}
      - {title: Heat demand, rebuilt, text: "Heat is not metered, so it is calculated from heat-pump electricity and outdoor temperature.", node: "card:cop_model"}
      - {title: A rule decides when to heat, text: "Simple rules decide when each home charges its heat and hot-water tanks. Smarter control comes later.", node: "card:controllers"}
      - {title: The year is scored, text: "Each rule is judged on the electricity bill, the highest grid draw and the electricity bought, against doing nothing.", node: "panel:kpis"}
  findings:
    title: What the first test shows
    verdict: >
      The [[{names.night}|rule_based_control]] moves {derived.rule.shift_pts:.1f} percentage points of the year's electricity
      out of the expensive hours (from {results[ALG-001_zero_action].high_tariff_import_share:.1%} to
      {results[ALG-003_basic_rbc].high_tariff_import_share:.1%} of everything bought) and cuts the
      [[highest grid draw|peak]] by {derived.rule.peak_cut_pct:.1f} %. But storing
      heat costs extra electricity: it buys {derived.rule.import_pct:.1f} % more overall, so the bill does not fall. It
      rises by {derived.rule.cost_pct:.1f} %. The cheap-hour discount is small, {tariff.low} against {tariff.high} Rp/kWh.
    rules_line: >
      The three tariff-timed variants land in the same range: the bill changes by {derived.tariff_rules.cost_min:+.1f} to
      {derived.tariff_rules.cost_max:+.1f} % and the highest grid draw by {derived.tariff_rules.peak_min:+.1f} to
      {derived.tariff_rules.peak_max:+.1f} % (a minus sign means a lower peak).
    chart_title: A cold winter weekday, hour by hour
    chart_caption: >
      Grid draw of all the buildings together on {derived.day.label}, the coldest weekday of the year, with and without the
      {names.night_lower}. The shaded hours are the expensive tariff.
    tiles_caption: Whole-year totals compared with no control. Lower is better.
    closing: >
      So timing alone, with simple rules, trims the peak but does not save money. That is why the next phases add smarter
      control and richer tariffs.
  trust:
    title: Why you can trust it, and where not
    validation: >
      {derived.validation.passed} of {derived.validation.total} validation checks pass; the others pass only partly or only as
      a plausibility check.
    classes_title: What is real, and what is not
    classes:
      measured: {label: Measured, meaning: recorded by a sensor or meter}
      derived: {label: Calculated, meaning: worked out from measured data with a stated formula}
      modeled: {label: Estimated by a model, meaning: produced by a model, not observed}
      synthetic: {label: Constructed for this study, meaning: built because no real data exists}
      assumption: {label: Assumed, meaning: a chosen value with no direct data behind it}
      mixed: {label: A mix, meaning: contains several of the kinds above}
    limitations_title: The three biggest limits
    limitations:
      - title: The CO₂ curve is an estimate
        text: >
          It is modeled from generation and trade data. Its level is about {epfl[2016].hourly_consumption_vs_epfl.ratio_mean:.0%} to
          {epfl[2017].hourly_consumption_vs_epfl.ratio_mean:.0%} of a published reference, so use it for timing, not for absolute values.
        node: series:carbon_intensity
      - title: The tanks are assumed
        text: >
          No home has a documented tank, so the sizes follow a stated sizing rule and are tested at half and double size.
        node: card:tanks
      - title: Comfort is not scored
        text: >
          The model has no indoor temperature, so heat demand is always met and comfort cannot be judged yet.
        node: card:environment
  next:
    title: What comes next
    source_note: From the project roadmap in docs/master_plan.md
    phases_shown: [B, C]


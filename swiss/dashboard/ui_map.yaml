# ---------------------------------------------------------------- control, reward, results (plan §4.3)

card:reward:
  label: Reward R-001
  display_name: How a run is scored
  figures: [reward_year]
  primary: R-001
  nodes: [R-001, D-019, D-018]
  summary: >
    Penalty-only reward: cost, squared peak and ramping, each divided by its mean under the uncontrolled run. Carbon has
    weight zero. No comfort term because comfort cannot be measured in this dataset (D-018, D-019).
  numbers:
    - {label: Cost scale, value: '{reward_scales.cost:.4f}', unit: CHF/step}

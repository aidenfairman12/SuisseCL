# ui_map.yaml - the ONLY hand-written mapping of the audit dashboard (plan §3).
#
# Each top-level key is one clickable UI element. Keys are "<kind>:<name>" with kind in
#   series | card | kpi | map | panel | figure
# Fields:
#   label      short title shown on the card
#   nodes      registry IDs (and other node IDs such as QC:..., PAR:...) the element is built from
#   primary    the main node (its classification badge is shown)
#   classification  measured | derived | modeled | synthetic | assumption | mixed  (for series/cards)
#   summary    plain-language text. Numbers ONLY via placeholders {namespace.path:format}; lint.py rejects digits
#              in prose that are not inside a placeholder, a registry ID or _settings.prose_allowed_tokens.
#   numbers    key numbers: [{label, value: "{placeholder}", unit}]
#   caveats    warnings shown prominently (same placeholder rules)
#   code       ["path.py::function"] - cut out with ast at build time and embedded with the commit SHA
#   qc         QC node IDs, e.g. QC:qc_carbon_2023
#   docs       repo files to link
#   flags      [{column, label}] hour flags drawn by the trust overlay
#   lineage_end  for synthetic items whose lineage ends in a decision/assumption instead of a source
#   nodes_open_issues  true = link every currently open ISS-* (computed at build time, not hand-listed)
# Placeholder namespaces (filled by build_bundle.load_data): qc_carbon, qc_weather, qc_tariff, qc_thermal,
#   qc_buildings, backtest, epfl, validation, thermal_params, build_manifest, reward_scales, baselines_meta,
#   columns, results[<controller>], sensitivity[<variant>|<controller>].
# Load with yaml.safe_load only.

_settings:
  # tokens with digits that may appear in prose without a placeholder (years, version strings, unit names)
  prose_allowed_tokens: ['2023', '2016', '2017', '2016-17', '3.3.0', 'CO2', 'CO2eq', 'kWh_th', 'kW²', 'ALG-001..004',
                         '24-hour', 'AR5', 'A.III.2', 'Building_1', 'Building_6', 'SPF_SH']
  classification_colours:
    measured: '#2b6cb0'
    derived: '#2f855a'
    modeled: '#b7791f'
    synthetic: '#c53030'
    assumption: '#6b46c1'
    mixed: '#4a5568'


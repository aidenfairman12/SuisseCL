    - {column: gap_interpolated_flag, label: interpolated}
  code: [swiss/pipeline/build_carbon.py::intensity, swiss/pipeline/build_carbon.py, swiss/validation/compare_epfl_carbon.py::stats]
  docs: [docs/data/data_quality_reports/carbon_epfl_comparison.md]


  summary: >
    The same controllers rerun with half and double tank sizes, near-lossless tanks, and a flat COP. Values are
    changes against the uncontrolled run of the same variant. Only aggregates exist for the variants (no run traces).
  docs: [docs/experiments/validation_reports/validation_phase_a.md]
  code: [swiss/experiments/run_sensitivity.py]

panel:validation:
  label: Validation checks
  nodes: [V1, V2, V3, V4, V5, V6, V7, V8, V9]
  summary: >
    Internal-consistency and plausibility checks, not calibration against observations.
  docs: [docs/experiments/validation_reports/validation_phase_a.md]

